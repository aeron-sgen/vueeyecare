# Preview deploy: serves the committed, verified dist/ under https://sgencms.github.io/<repo>/.
# It does not rebuild. src/tools/preview.mjs only re-bases the root-relative paths for the /<repo>/ subfolder
# and keeps the copy out of search engines: every page gets <meta name="robots" content="noindex, nofollow">,
# robots.txt disallows everything, and the Netlify _redirects/_headers files are left out.
# The preview is a copy of a live practice site on another domain, so it must never be indexed.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', 'src/tools/preview.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-base dist/ for the /<repo>/ subfolder (noindex copy)
        run: node src/tools/preview.mjs "/${{ github.event.repository.name }}"
      - name: Check the copy is noindex
        run: |
          total=$(find _site -name '*.html' | wc -l)
          noindex=$(grep -rl 'content="noindex, nofollow"' _site --include=*.html | wc -l)
          echo "pages: $total  noindex: $noindex"
          test "$total" -gt 0 && test "$total" -eq "$noindex"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
